<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders Arcade</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Press Start 2P', system-ui, -apple-system, sans-serif;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #000;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }
        
        #gameMenu, #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .button {
            background-color: #4a00e0;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            font-family: 'Press Start 2P', system-ui, -apple-system, sans-serif;
            text-transform: uppercase;
        }
        
        .button:hover {
            background-color: #6e00ff;
            transform: scale(1.05);
        }
        
        .title {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px #4a00e0, 0 0 20px #4a00e0, 0 0 30px #4a00e0;
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 10px #4a00e0, 0 0 20px #4a00e0, 0 0 30px #4a00e0;
            }
            to {
                text-shadow: 0 0 20px #4a00e0, 0 0 30px #4a00e0, 0 0 40px #4a00e0;
            }
        }
        
        .score {
            color: white;
            font-size: 1.2rem;
            text-align: left;
            padding: 10px;
            pointer-events: none;
        }
        
        .lives {
            display: flex;
            padding: 10px;
        }
        
        .life {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            color: #ff4d4d;
        }
        
        .powerup-icon {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .instructions {
            color: #bbb;
            font-size: 0.8rem;
            text-align: center;
            margin: 20px 0;
            max-width: 600px;
            line-height: 1.4;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .fadeIn {
            animation: fadeIn 0.5s forwards;
        }
        
        @font-face {
            font-family: 'Press Start 2P';
            src: url('https://cdn.jsdelivr.net/npm/press-start-2p-font@1.0.0/PressStart2P-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        .mute-button {
            position: absolute;
            right: 20px;
            top: 20px;
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 101;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="score">SCORE: <span id="scoreValue">0</span></div>
            <div class="lives" id="livesContainer"></div>
        </div>
        
        <div id="gameMenu">
            <h1 class="title">SPACE INVADERS</h1>
            <button class="button" id="startButton">Start Game</button>
            <div class="instructions">
                <p>Use ARROW KEYS or WASD to move. SPACE to shoot.</p>
                <p>Collect power-ups to enhance your weapons!</p>
                <p>Survive waves of increasingly difficult enemies.</p>
            </div>
        </div>
        
        <div id="gameOver" style="display: none;">
            <h1 class="title">GAME OVER</h1>
            <h2 class="text-white text-xl mb-4">FINAL SCORE: <span id="finalScore">0</span></h2>
            <button class="button" id="restartButton">Play Again</button>
        </div>
        
        <button class="mute-button" id="muteButton">🔊</button>
    </div>

    <script>
        // Game Constants and Variables
        const GAME_STATE = {
            MENU: 0,
            PLAYING: 1,
            GAME_OVER: 2
        };
        
        // Main Game Class
        class SpaceInvadersGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gameState = GAME_STATE.MENU;
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.enemySpawnRate = 1500; // milliseconds
                this.lastEnemySpawn = 0;
                this.powerUpSpawnRate = 10000; // milliseconds
                this.lastPowerUpSpawn = 0;
                this.entities = {
                    player: null,
                    bullets: [],
                    enemies: [],
                    enemyBullets: [],
                    explosions: [],
                    powerUps: [],
                    stars: []
                };
                this.keys = {};
                this.lastTime = 0;
                this.muted = false;
                this.activePowerUp = null;
                this.powerUpTimeLeft = 0;
                this.isTouch = 'ontouchstart' in window;
                this.touchPosition = { x: 0, y: 0 };
                this.isTouching = false;

                // Sounds
                this.sounds = {
                    shoot: new Audio('https://cdn.jsdelivr.net/gh/kittykatattack/sound.js/sounds/shoot.wav'),
                    explosion: new Audio('https://cdn.jsdelivr.net/gh/kittykatattack/sound.js/sounds/explosion.wav'),
                    powerUp: new Audio('https://cdn.jsdelivr.net/gh/kittykatattack/sound.js/sounds/powerUp.wav'),
                    gameOver: new Audio('https://cdn.jsdelivr.net/gh/kittykatattack/sound.js/sounds/explosion.wav')
                };
                
                // Initialize the game
                this.init();
            }
            
            init() {
                // Event Listeners
                window.addEventListener('keydown', e => this.keys[e.key] = true);
                window.addEventListener('keyup', e => this.keys[e.key] = false);
                
                if (this.isTouch) {
                    this.canvas.addEventListener('touchstart', e => {
                        this.isTouching = true;
                        const touch = e.touches[0];
                        this.touchPosition.x = touch.clientX;
                        this.touchPosition.y = touch.clientY;
                        // Shoot on touch
                        if (this.gameState === GAME_STATE.PLAYING) {
                            this.shootBullet();
                        }
                    });
                    
                    this.canvas.addEventListener('touchmove', e => {
                        if (this.isTouching) {
                            const touch = e.touches[0];
                            this.touchPosition.x = touch.clientX;
                            this.touchPosition.y = touch.clientY;
                        }
                    });
                    
                    this.canvas.addEventListener('touchend', () => {
                        this.isTouching = false;
                    });
                }
                
                // UI Elements
                document.getElementById('startButton').addEventListener('click', () => this.startGame());
                document.getElementById('restartButton').addEventListener('click', () => this.restartGame());
                document.getElementById('muteButton').addEventListener('click', () => this.toggleMute());
                
                // Resize handler
                window.addEventListener('resize', () => this.resizeCanvas());
                this.resizeCanvas();
                
                // Create initial starfield
                this.createStarfield();
                
                // Start the render loop
                requestAnimationFrame(this.gameLoop.bind(this));
            }
            
            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                // Recreate starfield on resize
                this.createStarfield();
            }
            
            createStarfield() {
                // Clear existing stars
                this.entities.stars = [];
                
                // Create stars in 3 layers for parallax effect
                const numStars = Math.floor(this.canvas.width * this.canvas.height / 1000);
                
                for (let i = 0; i < numStars; i++) {
                    const layer = Math.floor(Math.random() * 3) + 1; // 1, 2, or 3
                    this.entities.stars.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 2 + 0.5,
                        speed: 0.2 * layer,
                        opacity: Math.random() * 0.5 + 0.3,
                        layer
                    });
                }
            }
            
            startGame() {
                // Reset game state
                this.gameState = GAME_STATE.PLAYING;
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.enemySpawnRate = 1500;
                this.lastEnemySpawn = 0;
                this.lastPowerUpSpawn = 0;
                this.activePowerUp = null;
                this.powerUpTimeLeft = 0;
                
                // Clear entities
                this.entities.bullets = [];
                this.entities.enemies = [];
                this.entities.enemyBullets = [];
                this.entities.explosions = [];
                this.entities.powerUps = [];
                
                // Create player ship
                this.entities.player = {
                    x: this.canvas.width / 2,
                    y: this.canvas.height - 100,
                    width: 50,
                    height: 40,
                    speed: 5,
                    color: '#4d79ff'
                };
                
                // Update UI
                document.getElementById('scoreValue').textContent = this.score;
                this.updateLivesDisplay();
                
                // Hide menu
                document.getElementById('gameMenu').style.display = 'none';
                document.getElementById('gameOver').style.display = 'none';
            }
            
            restartGame() {
                this.startGame();
            }
            
            toggleMute() {
                this.muted = !this.muted;
                document.getElementById('muteButton').textContent = this.muted ? '🔇' : '🔊';
            }
            
            playSound(sound) {
                if (!this.muted) {
                    // Clone and play to allow overlapping sounds
                    const soundClone = sound.cloneNode();
                    soundClone.volume = 0.3;
                    soundClone.play().catch(e => console.log("Audio play error:", e));
                }
            }
            
            updateLivesDisplay() {
                const livesContainer = document.getElementById('livesContainer');
                livesContainer.innerHTML = '';
                
                for (let i = 0; i < this.lives; i++) {
                    const lifeIcon = document.createElement('div');
                    lifeIcon.className = 'life';
                    lifeIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                    livesContainer.appendChild(lifeIcon);
                }
            }
            
            gameLoop(timestamp) {
                // Calculate delta time
                const deltaTime = timestamp - (this.lastTime || timestamp);
                this.lastTime = timestamp;
                
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Update and draw based on game state
                if (this.gameState === GAME_STATE.PLAYING) {
                    this.update(deltaTime);
                }
                
                this.render();
                
                // Continue the game loop
                requestAnimationFrame(this.gameLoop.bind(this));
            }
            
            update(deltaTime) {
                // Update starfield (parallax scrolling)
                this.updateStars(deltaTime);
                
                // Update player movement
                this.updatePlayerMovement();
                
                // Handle shooting
                if ((this.keys[' '] || this.keys.Space) && this.gameState === GAME_STATE.PLAYING) {
                    this.shootBullet();
                    this.keys[' '] = false; // Prevent continuous shooting by holding space
                    this.keys.Space = false;
                }
                
                // Update all entities
                this.updateBullets(deltaTime);
                this.updateEnemies(deltaTime);
                this.updateEnemyBullets(deltaTime);
                this.updateExplosions(deltaTime);
                this.updatePowerUps(deltaTime);
                
                // Spawn new enemies based on time
                this.spawnEnemies(deltaTime);
                
                // Spawn power-ups occasionally
                this.spawnPowerUps(deltaTime);
                
                // Update power-up timer
                if (this.activePowerUp && this.powerUpTimeLeft > 0) {
                    this.powerUpTimeLeft -= deltaTime;
                    if (this.powerUpTimeLeft <= 0) {
                        this.activePowerUp = null;
                    }
                }
                
                // Check collisions
                this.checkCollisions();
            }
            
            updateStars(deltaTime) {
                this.entities.stars.forEach(star => {
                    star.y += star.speed * deltaTime / 16;
                    
                    // Wrap stars around when they go off screen
                    if (star.y > this.canvas.height) {
                        star.y = 0;
                        star.x = Math.random() * this.canvas.width;
                    }
                });
            }
            
            updatePlayerMovement() {
                const player = this.entities.player;
                
                // Keyboard controls
                if (this.keys.ArrowLeft || this.keys.a || this.keys.A) {
                    player.x -= player.speed;
                }
                if (this.keys.ArrowRight || this.keys.d || this.keys.D) {
                    player.x += player.speed;
                }
                if (this.keys.ArrowUp || this.keys.w || this.keys.W) {
                    player.y -= player.speed;
                }
                if (this.keys.ArrowDown || this.keys.s || this.keys.S) {
                    player.y += player.speed;
                }
                
                // Touch controls
                if (this.isTouching) {
                    // Move towards touch position
                    const dx = this.touchPosition.x - player.x;
                    const dy = this.touchPosition.y - player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance > player.speed) {
                        player.x += (dx / distance) * player.speed;
                        player.y += (dy / distance) * player.speed;
                    }
                }
                
                // Keep player within bounds
                player.x = Math.max(player.width / 2, Math.min(this.canvas.width - player.width / 2, player.x));
                player.y = Math.max(player.height / 2, Math.min(this.canvas.height - player.height / 2, player.y));
            }
            
            shootBullet() {
                const player = this.entities.player;
                
                if (this.activePowerUp === 'triple') {
                    // Triple shot
                    this.entities.bullets.push({
                        x: player.x,
                        y: player.y - 15,
                        width: 4,
                        height: 10,
                        speed: 10,
                        color: '#00ffff'
                    });
                    
                    this.entities.bullets.push({
                        x: player.x - 15,
                        y: player.y - 5,
                        width: 4,
                        height: 10,
                        speed: 10,
                        color: '#00ffff'
                    });
                    
                    this.entities.bullets.push({
                        x: player.x + 15,
                        y: player.y - 5,
                        width: 4,
                        height: 10,
                        speed: 10,
                        color: '#00ffff'
                    });
                } else if (this.activePowerUp === 'rapid') {
                    // Rapid fire - thinner but faster bullets
                    this.entities.bullets.push({
                        x: player.x,
                        y: player.y - 15,
                        width: 3,
                        height: 12,
                        speed: 15,
                        color: '#ff00ff'
                    });
                    
                    // Set a timeout to fire another bullet soon
                    setTimeout(() => {
                        if (this.gameState === GAME_STATE.PLAYING && this.activePowerUp === 'rapid') {
                            this.entities.bullets.push({
                                x: player.x,
                                y: player.y - 15,
                                width: 3,
                                height: 12,
                                speed: 15,
                                color: '#ff00ff'
                            });
                        }
                    }, 150);
                } else if (this.activePowerUp === 'laser') {
                    // Laser - wide and powerful
                    this.entities.bullets.push({
                        x: player.x,
                        y: player.y - 20,
                        width: 8,
                        height: 20,
                        speed: 12,
                        color: '#ff0000',
                        isLaser: true
                    });
                } else {
                    // Normal shot
                    this.entities.bullets.push({
                        x: player.x,
                        y: player.y - 15,
                        width: 4,
                        height: 10,
                        speed: 8,
                        color: '#ffff00'
                    });
                }
                
                this.playSound(this.sounds.shoot);
            }
            
            updateBullets(deltaTime) {
                // Update bullet positions
                this.entities.bullets = this.entities.bullets.filter(bullet => {
                    bullet.y -= bullet.speed;
                    return bullet.y + bullet.height > 0; // Remove bullets that go off screen
                });
            }
            
            updateEnemies(deltaTime) {
                // Update enemy positions and behavior
                this.entities.enemies = this.entities.enemies.filter(enemy => {
                    // Move enemy based on its pattern
                    if (enemy.pattern === 'zigzag') {
                        enemy.x += Math.sin(Date.now() * 0.003) * 2;
                        enemy.y += enemy.speed;
                    } else if (enemy.pattern === 'straight') {
                        enemy.y += enemy.speed;
                    } else if (enemy.pattern === 'curve') {
                        enemy.angle = (enemy.angle || 0) + 0.02;
                        enemy.x += Math.cos(enemy.angle) * 2;
                        enemy.y += enemy.speed;
                    }
                    
                    // Enemy shooting
                    if (Math.random() < 0.003 * this.level) {
                        this.enemyShoot(enemy);
                    }
                    
                    // Remove enemies that go off screen
                    return enemy.y - enemy.height < this.canvas.height;
                });
            }
            
            enemyShoot(enemy) {
                this.entities.enemyBullets.push({
                    x: enemy.x,
                    y: enemy.y + enemy.height / 2,
                    width: 4,
                    height: 10,
                    speed: 5,
                    color: enemy.bulletColor || '#ff0000'
                });
            }
            
            updateEnemyBullets(deltaTime) {
                // Update enemy bullet positions
                this.entities.enemyBullets = this.entities.enemyBullets.filter(bullet => {
                    bullet.y += bullet.speed;
                    return bullet.y < this.canvas.height; // Remove bullets that go off screen
                });
            }
            
            updateExplosions(deltaTime) {
                // Update explosion animations
                this.entities.explosions = this.entities.explosions.filter(explosion => {
                    explosion.frame++;
                    return explosion.frame < explosion.maxFrames;
                });
            }
            
            updatePowerUps(deltaTime) {
                // Update power-up positions
                this.entities.powerUps = this.entities.powerUps.filter(powerUp => {
                    powerUp.y += powerUp.speed;
                    return powerUp.y < this.canvas.height; // Remove power-ups that go off screen
                });
            }
            
            spawnEnemies(deltaTime) {
                const currentTime = Date.now();
                
                if (currentTime - this.lastEnemySpawn > this.enemySpawnRate) {
                    this.lastEnemySpawn = currentTime;
                    
                    // Determine enemy type based on level
                    const types = ['basic'];
                    if (this.level >= 2) types.push('fast');
                    if (this.level >= 3) types.push('tank');
                    if (this.level >= 5) types.push('boss');
                    
                    const type = types[Math.floor(Math.random() * types.length)];
                    const pattern = ['straight', 'zigzag', 'curve'][Math.floor(Math.random() * 3)];
                    
                    let enemy = {
                        x: Math.random() * (this.canvas.width - 60) + 30,
                        y: -50,
                        pattern,
                        type
                    };
                    
                    // Set enemy properties based on type
                    switch (type) {
                        case 'basic':
                            enemy.width = 40;
                            enemy.height = 30;
                            enemy.speed = 1.5;
                            enemy.health = 1;
                            enemy.color = '#ff4d4d';
                            enemy.bulletColor = '#ff8080';
                            enemy.score = 100;
                            break;
                        case 'fast':
                            enemy.width = 30;
                            enemy.height = 20;
                            enemy.speed = 3;
                            enemy.health = 1;
                            enemy.color = '#ffff4d';
                            enemy.bulletColor = '#ffff80';
                            enemy.score = 150;
                            break;
                        case 'tank':
                            enemy.width = 50;
                            enemy.height = 40;
                            enemy.speed = 1;
                            enemy.health = 3;
                            enemy.color = '#4dff4d';
                            enemy.bulletColor = '#80ff80';
                            enemy.score = 200;
                            break;
                        case 'boss':
                            enemy.width = 80;
                            enemy.height = 60;
                            enemy.speed = 0.8;
                            enemy.health = 5;
                            enemy.color = '#8080ff';
                            enemy.bulletColor = '#a0a0ff';
                            enemy.score = 500;
                            break;
                    }
                    
                    this.entities.enemies.push(enemy);
                    
                    // Increase difficulty over time
                    this.enemySpawnRate = Math.max(300, 1500 - (this.level * 100));
                    
                    // Level up based on score
                    this.level = Math.floor(this.score / 1000) + 1;
                }
            }
            
            spawnPowerUps(deltaTime) {
                const currentTime = Date.now();
                
                if (currentTime - this.lastPowerUpSpawn > this.powerUpSpawnRate) {
                    this.lastPowerUpSpawn = currentTime;
                    
                    // Random power-up type
                    const types = ['triple', 'rapid', 'laser', 'health'];
                    const type = types[Math.floor(Math.random() * types.length)];
                    
                    let color;
                    switch (type) {
                        case 'triple': color = '#00ffff'; break;
                        case 'rapid': color = '#ff00ff'; break;
                        case 'laser': color = '#ff0000'; break;
                        case 'health': color = '#00ff00'; break;
                    }
                    
                    this.entities.powerUps.push({
                        x: Math.random() * (this.canvas.width - 30) + 15,
                        y: -30,
                        width: 30,
                        height: 30,
                        speed: 2,
                        type,
                        color
                    });
                }
            }
            
            checkCollisions() {
                const player = this.entities.player;
                
                // Check player-enemy collisions
                this.entities.enemies.forEach((enemy, enemyIndex) => {
                    if (this.checkRectCollision(player, enemy)) {
                        // Player hit enemy
                        this.createExplosion(enemy.x, enemy.y, enemy.color);
                        this.entities.enemies.splice(enemyIndex, 1);
                        this.loseLife();
                    }
                });
                
                // Check bullet-enemy collisions
                this.entities.bullets.forEach((bullet, bulletIndex) => {
                    let bulletRemoved = false;
                    
                    this.entities.enemies.forEach((enemy, enemyIndex) => {
                        if (bulletRemoved) return;
                        
                        if (this.checkRectCollision(bullet, enemy)) {
                            // Bullet hit enemy
                            enemy.health--;
                            
                            if (enemy.health <= 0) {
                                // Enemy destroyed
                                this.createExplosion(enemy.x, enemy.y, enemy.color);
                                this.entities.enemies.splice(enemyIndex, 1);
                                this.score += enemy.score;
                                document.getElementById('scoreValue').textContent = this.score;
                                this.playSound(this.sounds.explosion);
                            }
                            
                            // Remove bullet unless it's a laser
                            if (!bullet.isLaser) {
                                this.entities.bullets.splice(bulletIndex, 1);
                                bulletRemoved = true;
                            }
                        }
                    });
                });
                
                // Check enemy bullet-player collisions
                this.entities.enemyBullets.forEach((bullet, index) => {
                    if (this.checkRectCollision(bullet, player)) {
                        // Player hit by enemy bullet
                        this.entities.enemyBullets.splice(index, 1);
                        this.loseLife();
                    }
                });
                
                // Check power-up-player collisions
                this.entities.powerUps.forEach((powerUp, index) => {
                    if (this.checkRectCollision(powerUp, player)) {
                        // Player collected power-up
                        this.entities.powerUps.splice(index, 1);
                        this.activatePowerUp(powerUp.type);
                        this.playSound(this.sounds.powerUp);
                    }
                });
            }
            
            checkRectCollision(rect1, rect2) {
                return (
                    rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y
                );
            }
            
            loseLife() {
                this.lives--;
                this.updateLivesDisplay();
                this.createExplosion(this.entities.player.x, this.entities.player.y, '#4d79ff');
                this.playSound(this.sounds.explosion);
                
                if (this.lives <= 0) {
                    this.gameOver();
                }
            }
            
            activatePowerUp(type) {
                // Clear existing power-up
                this.activePowerUp = null;
                
                if (type === 'health') {
                    // Instant health power-up
                    if (this.lives < 5) {
                        this.lives++;
                        this.updateLivesDisplay();
                    }
                } else {
                    // Weapon power-ups
                    this.activePowerUp = type;
                    this.powerUpTimeLeft = 10000; // 10 seconds
                }
            }
            
            createExplosion(x, y, color) {
                this.entities.explosions.push({
                    x,
                    y,
                    radius: 5,
                    maxRadius: 30,
                    frame: 0,
                    maxFrames: 20,
                    color: color
                });
            }
            
            gameOver() {
                this.gameState = GAME_STATE.GAME_OVER;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOver').style.display = 'flex';
                this.playSound(this.sounds.gameOver);
            }
            
            render() {
                // Draw starfield background
                this.drawStarfield();
                
                // Draw game entities
                if (this.gameState === GAME_STATE.PLAYING) {
                    // Draw player
                    this.drawPlayer();
                    
                    // Draw bullets
                    this.drawBullets();
                    
                    // Draw enemies
                    this.drawEnemies();
                    
                    // Draw enemy bullets
                    this.drawEnemyBullets();
                    
                    // Draw power-ups
                    this.drawPowerUps();
                    
                    // Draw explosions
                    this.drawExplosions();
                    
                    // Draw power-up indicator
                    this.drawPowerUpIndicator();
                }
            }
            
            drawStarfield() {
                this.entities.stars.forEach(star => {
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }
            
            drawPlayer() {
                const player = this.entities.player;
                
                // Draw ship body
                this.ctx.fillStyle = player.color;
                this.ctx.beginPath();
                this.ctx.moveTo(player.x, player.y - player.height / 2);
                this.ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
                this.ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
                this.ctx.closePath();
                this.ctx.fill();
                
                // Draw cockpit
                this.ctx.fillStyle = '#ffffff';
                this.ctx.beginPath();
                this.ctx.arc(player.x, player.y - player.height / 6, player.width / 6, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Draw engine glow
                this.ctx.fillStyle = `rgba(255, 100, 50, ${0.7 + 0.3 * Math.sin(Date.now() * 0.01)})`;
                this.ctx.beginPath();
                this.ctx.moveTo(player.x - player.width / 4, player.y + player.height / 2);
                this.ctx.lineTo(player.x, player.y + player.height / 2 + 10);
                this.ctx.lineTo(player.x + player.width / 4, player.y + player.height / 2);
                this.ctx.closePath();
                this.ctx.fill();
                
                // Draw shield if we have a power-up
                if (this.activePowerUp) {
                    this.ctx.strokeStyle = this.getPowerUpColor(this.activePowerUp);
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(player.x, player.y, player.width * 0.7, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
            }
            
            drawBullets() {
                this.entities.bullets.forEach(bullet => {
                    this.ctx.fillStyle = bullet.color;
                    
                    if (bullet.isLaser) {
                        // Draw laser with glow effect
                        this.ctx.shadowColor = bullet.color;
                        this.ctx.shadowBlur = 10;
                        this.ctx.fillRect(bullet.x - bullet.width / 2, bullet.y - bullet.height / 2, bullet.width, bullet.height);
                        this.ctx.shadowBlur = 0;
                    } else {
                        // Draw regular bullet
                        this.ctx.fillRect(bullet.x - bullet.width / 2, bullet.y - bullet.height / 2, bullet.width, bullet.height);
                    }
                });
            }
            
            drawEnemies() {
                this.entities.enemies.forEach(enemy => {
                    // Draw different enemy shapes based on type
                    switch (enemy.type) {
                        case 'basic':
                            this.drawBasicEnemy(enemy);
                            break;
                        case 'fast':
                            this.drawFastEnemy(enemy);
                            break;
                        case 'tank':
                            this.drawTankEnemy(enemy);
                            break;
                        case 'boss':
                            this.drawBossEnemy(enemy);
                            break;
                    }
                });
            }
            
            drawBasicEnemy(enemy) {
                this.ctx.fillStyle = enemy.color;
                
                // Draw saucer shape
                this.ctx.beginPath();
                this.ctx.ellipse(enemy.x, enemy.y, enemy.width / 2, enemy.height / 3, 0, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Draw dome
                this.ctx.beginPath();
                this.ctx.ellipse(enemy.x, enemy.y - enemy.height / 6, enemy.width / 3, enemy.height / 4, 0, 0, Math.PI);
                this.ctx.fill();
                
                // Draw lights
                this.ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 3; i++) {
                    const xOffset = (i - 1) * enemy.width / 4;
                    this.ctx.beginPath();
                    this.ctx.arc(enemy.x + xOffset, enemy.y + enemy.height / 6, 2, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }
            
            drawFastEnemy(enemy) {
                this.ctx.fillStyle = enemy.color;
                
                // Draw arrow shape
                this.ctx.beginPath();
                this.ctx.moveTo(enemy.x, enemy.y - enemy.height / 2);
                this.ctx.lineTo(enemy.x - enemy.width / 2, enemy.y);
                this.ctx.lineTo(enemy.x - enemy.width / 4, enemy.y + enemy.height / 2);
                this.ctx.lineTo(enemy.x + enemy.width / 4, enemy.y + enemy.height / 2);
                this.ctx.lineTo(enemy.x + enemy.width / 2, enemy.y);
                this.ctx.closePath();
                this.ctx.fill();
                
                // Draw thruster
                this.ctx.fillStyle = `rgba(255, 200, 0, ${0.7 + 0.3 * Math.sin(Date.now() * 0.02)})`;
                this.ctx.beginPath();
                this.ctx.moveTo(enemy.x - enemy.width / 6, enemy.y + enemy.height / 2);
                this.ctx.lineTo(enemy.x, enemy.y + enemy.height / 2 + 8);
                this.ctx.lineTo(enemy.x + enemy.width / 6, enemy.y + enemy.height / 2);
                this.ctx.closePath();
                this.ctx.fill();
            }
            
            drawTankEnemy(enemy) {
                this.ctx.fillStyle = enemy.color;
                
                // Draw body
                this.ctx.fillRect(enemy.x - enemy.width / 2, enemy.y - enemy.height / 2, enemy.width, enemy.height);
                
                // Draw armor plates
                this.ctx.fillStyle = this.adjustColor(enemy.color, -30);
                this.ctx.fillRect(enemy.x - enemy.width / 2, enemy.y - enemy.height / 2, enemy.width, enemy.height / 5);
                this.ctx.fillRect(enemy.x - enemy.width / 2, enemy.y + enemy.height / 3, enemy.width, enemy.height / 5);
                
                // Draw gun
                this.ctx.fillStyle = this.adjustColor(enemy.color, -50);
                this.ctx.fillRect(enemy.x - enemy.width / 10, enemy.y - enemy.height / 2 - 10, enemy.width / 5, 10);
            }
            
            drawBossEnemy(enemy) {
                this.ctx.fillStyle = enemy.color;
                
                // Draw main body (hexagon)
                this.ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i * Math.PI / 3) - Math.PI / 2;
                    const x = enemy.x + Math.cos(angle) * enemy.width / 2;
                    const y = enemy.y + Math.sin(angle) * enemy.height / 2;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                this.ctx.closePath();
                this.ctx.fill();
                
                // Draw center eye
                this.ctx.fillStyle = `rgba(255, 50, 50, ${0.7 + 0.3 * Math.sin(Date.now() * 0.005)})`;
                this.ctx.beginPath();
                this.ctx.arc(enemy.x, enemy.y, enemy.width / 6, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Draw weapon pods
                this.ctx.fillStyle = this.adjustColor(enemy.color, -20);
                [-1, 1].forEach(side => {
                    this.ctx.beginPath();
                    this.ctx.arc(enemy.x + (enemy.width / 2 * 0.7) * side, enemy.y + enemy.height / 4, enemy.width / 8, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                
                // Health bar
                const healthBarWidth = enemy.width * 0.8;
                const healthPercentage = enemy.health / 5; // Boss has 5 health
                
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                this.ctx.fillRect(enemy.x - healthBarWidth / 2, enemy.y - enemy.height / 2 - 10, healthBarWidth, 5);
                
                this.ctx.fillStyle = 'rgba(255, 50, 50, 0.8)';
                this.ctx.fillRect(enemy.x - healthBarWidth / 2, enemy.y - enemy.height / 2 - 10, healthBarWidth * healthPercentage, 5);
            }
            
            drawEnemyBullets() {
                this.entities.enemyBullets.forEach(bullet => {
                    this.ctx.fillStyle = bullet.color;
                    this.ctx.fillRect(bullet.x - bullet.width / 2, bullet.y - bullet.height / 2, bullet.width, bullet.height);
                });
            }
            
            drawPowerUps() {
                this.entities.powerUps.forEach(powerUp => {
                    // Draw power-up capsule
                    this.ctx.fillStyle = powerUp.color;
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 2;
                    
                    // Capsule body
                    this.ctx.beginPath();
                    this.ctx.roundRect(powerUp.x - powerUp.width / 2, powerUp.y - powerUp.height / 2, 
                                      powerUp.width, powerUp.height, 10);
                    this.ctx.fill();
                    this.ctx.stroke();
                    
                    // Inner symbol based on type
                    this.ctx.fillStyle = '#ffffff';
                    switch (powerUp.type) {
                        case 'triple':
                            // Triple shot symbol (three dots)
                            for (let i = -1; i <= 1; i++) {
                                this.ctx.beginPath();
                                this.ctx.arc(powerUp.x + i * 6, powerUp.y, 3, 0, Math.PI * 2);
                                this.ctx.fill();
                            }
                            break;
                        case 'rapid':
                            // Rapid fire symbol (lightning bolt)
                            this.ctx.beginPath();
                            this.ctx.moveTo(powerUp.x - 5, powerUp.y - 8);
                            this.ctx.lineTo(powerUp.x + 2, powerUp.y - 2);
                            this.ctx.lineTo(powerUp.x - 2, powerUp.y);
                            this.ctx.lineTo(powerUp.x + 5, powerUp.y + 8);
                            this.ctx.stroke();
                            break;
                        case 'laser':
                            // Laser symbol (vertical line)
                            this.ctx.lineWidth = 3;
                            this.ctx.beginPath();
                            this.ctx.moveTo(powerUp.x, powerUp.y - 8);
                            this.ctx.lineTo(powerUp.x, powerUp.y + 8);
                            this.ctx.stroke();
                            break;
                        case 'health':
                            // Health symbol (plus)
                            this.ctx.lineWidth = 3;
                            this.ctx.beginPath();
                            this.ctx.moveTo(powerUp.x - 6, powerUp.y);
                            this.ctx.lineTo(powerUp.x + 6, powerUp.y);
                            this.ctx.moveTo(powerUp.x, powerUp.y - 6);
                            this.ctx.lineTo(powerUp.x, powerUp.y + 6);
                            this.ctx.stroke();
                            break;
                    }
                    
                    // Glow effect
                    const glowSize = 5 + Math.sin(Date.now() * 0.01) * 3;
                    this.ctx.fillStyle = `rgba(${this.hexToRgb(powerUp.color)}, 0.3)`;
                    this.ctx.beginPath();
                    this.ctx.roundRect(powerUp.x - powerUp.width / 2 - glowSize, 
                                      powerUp.y - powerUp.height / 2 - glowSize,
                                      powerUp.width + glowSize * 2, 
                                      powerUp.height + glowSize * 2, 15);
                    this.ctx.fill();
                });
            }
            
            drawExplosions() {
                this.entities.explosions.forEach(explosion => {
                    const progress = explosion.frame / explosion.maxFrames;
                    const radius = explosion.radius + (explosion.maxRadius - explosion.radius) * progress;
                    const alpha = 1 - progress;
                    
                    // Outer explosion
                    this.ctx.fillStyle = `rgba(${this.hexToRgb(explosion.color)}, ${alpha * 0.5})`;
                    this.ctx.beginPath();
                    this.ctx.arc(explosion.x, explosion.y, radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Inner explosion
                    this.ctx.fillStyle = `rgba(255, 200, 50, ${alpha * 0.8})`;
                    this.ctx.beginPath();
                    this.ctx.arc(explosion.x, explosion.y, radius * 0.6, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Center
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    this.ctx.beginPath();
                    this.ctx.arc(explosion.x, explosion.y, radius * 0.3, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }
            
            drawPowerUpIndicator() {
                if (this.activePowerUp && this.powerUpTimeLeft > 0) {
                    const color = this.getPowerUpColor(this.activePowerUp);
                    const timePercentage = this.powerUpTimeLeft / 10000;
                    
                    // Draw power-up timer at the top right
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    this.ctx.fillRect(this.canvas.width - 120, 20, 100, 20);
                    
                    this.ctx.fillStyle = color;
                    this.ctx.fillRect(this.canvas.width - 120, 20, 100 * timePercentage, 20);
                    
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(this.canvas.width - 120, 20, 100, 20);
                    
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '12px "Press Start 2P", monospace';
                    this.ctx.textAlign = 'center';
                    
                    let powerUpName = this.activePowerUp.toUpperCase();
                    this.ctx.fillText(powerUpName, this.canvas.width - 70, 35);
                }
            }
            
            // Utility functions
            adjustColor(hex, amount) {
                // Convert hex to RGB
                let r = parseInt(hex.substring(1, 3), 16);
                let g = parseInt(hex.substring(3, 5), 16);
                let b = parseInt(hex.substring(5, 7), 16);
                
                // Adjust values
                r = Math.max(0, Math.min(255, r + amount));
                g = Math.max(0, Math.min(255, g + amount));
                b = Math.max(0, Math.min(255, b + amount));
                
                // Convert back to hex
                return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            }
            
            hexToRgb(hex) {
                // Remove # if present
                hex = hex.replace('#', '');
                
                // Parse r, g, b values
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                
                return `${r}, ${g}, ${b}`;
            }
            
            getPowerUpColor(type) {
                switch (type) {
                    case 'triple': return '#00ffff';
                    case 'rapid': return '#ff00ff';
                    case 'laser': return '#ff0000';
                    case 'health': return '#00ff00';
                    default: return '#ffffff';
                }
            }
        }
        
        // Create game instance once the page is loaded
        window.addEventListener('load', () => {
            new SpaceInvadersGame();
        });
    </script>
